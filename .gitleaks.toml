title = "UniHub Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Ignore dummy secrets in test fixtures, test classes, documentation, and contract examples"
paths = [
    '''apps/backend/src/test/.*''',
    '''apps/workers/src/test/.*''',
    '''specs/.*''',
    '''docs/.*''',
    '''^contracts/http/features/[^/]+\.md$''',
    '''^contracts/http/standards\.md$'''
]
regexes = [
    '''columnDefinition''',
]
