title = "UniHub Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Ignore dummy secrets in test fixtures, test classes, and documentation specs"
paths = [
    '''apps/backend/src/test/.*''',
    '''apps/workers/src/test/.*''',
    '''specs/.*''',
    '''docs/.*'''
]
regexes = [
    '''columnDefinition''',
]
