bind 0.0.0.0
port 6379
protected-mode yes

# Connection and timeout tuning
timeout 0
tcp-keepalive 60

# Memory and eviction policy
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistence (AOF) to preserve rate-limit state across restarts
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshotting as a secondary safety net
save 900 1
save 300 10
save 60 10000

dir /data
