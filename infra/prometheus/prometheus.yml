global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["${BACKEND_1_HOST:-host.docker.internal:8081}", "${BACKEND_2_HOST:-host.docker.internal:8082}"]

  - job_name: "workers"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["${WORKERS_HOST:-host.docker.internal:8083}"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
