services:
  nginx:
    image: nginx:1.30-alpine
    container_name: unihub-nginx
    ports:
      - "80:80"
    environment:
      - BACKEND_1_HOST=${BACKEND_1_HOST:-host.docker.internal:8081}
      - BACKEND_2_HOST=${BACKEND_2_HOST:-host.docker.internal:8082}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - unihub-network

  redis:
    image: redis:8.6-alpine
    container_name: unihub-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    networks:
      - unihub-network

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: unihub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/definitions.json.template:/etc/rabbitmq/definitions.json.template:ro
      - rabbitmq-data:/var/lib/rabbitmq
    command: >
      /bin/sh -c 'sed -e "s/__RABBITMQ_USER__/$$RABBITMQ_DEFAULT_USER/g" -e "s/__RABBITMQ_PASSWORD__/$$RABBITMQ_DEFAULT_PASS/g" /etc/rabbitmq/definitions.json.template > /etc/rabbitmq/definitions.json && exec rabbitmq-server'
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    networks:
      - unihub-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: unihub-elasticsearch
    environment:
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.00"
    networks:
      - unihub-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: unihub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio123}
      MINIO_REGION: ${AWS_REGION:-ap-southeast-1}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    networks:
      - unihub-network

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: unihub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio123}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_ENDPOINT: http://minio:9000
    volumes:
      - ./minio/init:/init:ro
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/minio-init.done"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: "no"
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - unihub-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: unihub-nginx-exporter
    command:
      - "-nginx.scrape-uri=http://nginx:80/nginx_status"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
    networks:
      - unihub-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0
    container_name: unihub-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
    networks:
      - unihub-network

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: unihub-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      - "--enable-feature=envvar-expansion"
    ports:
      - "9090:9090"
    environment:
      - BACKEND_1_HOST=${BACKEND_1_HOST:-host.docker.internal:8081}
      - BACKEND_2_HOST=${BACKEND_2_HOST:-host.docker.internal:8082}
      - WORKERS_HOST=${WORKERS_HOST:-host.docker.internal:8083}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      nginx:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    networks:
      - unihub-network

  grafana:
    image: grafana/grafana:13.1.0-25893932881
    container_name: unihub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    networks:
      - unihub-network

volumes:
  redis-data:
    name: unihub-redis-data
  rabbitmq-data:
    name: unihub-rabbitmq-data
  elasticsearch-data:
    name: unihub-elasticsearch-data
  minio-data:
    name: unihub-minio-data
  prometheus-data:
    name: unihub-prometheus-data
  grafana-data:
    name: unihub-grafana-data

networks:
  unihub-network:
    name: unihub-network
    driver: bridge
