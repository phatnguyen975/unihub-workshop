# =============================================================================
# Spring Boot Application Configuration
# =============================================================================
spring:
  data:
    redis:
      password: ${SPRING_DATA_REDIS_PASSWORD}

app:
  otp:
    hmac-secret: test-secret-key-must-be-long-enough-for-hmac-sha256-testing
    ttl-minutes: 15

# =============================================================================
# RSA Key Configuration
# =============================================================================
rsa:
  private-key: classpath:security/valid-private.pem
  public-key: classpath:security/valid-public.pem

# =============================================================================
# Rate Limit Configuration
# =============================================================================
rate-limit:
  registration-path-patterns:
    - "/api/v1/registrations/**"
  registration-tier:
    capacity: 5
    refill-tokens: 5
    refill-duration: 10s
  browsing-tier:
    capacity: 100
    refill-tokens: 100
    refill-duration: 60s
  stream-path-patterns:
    - "/api/v1/stream/**"
  stream-tier:
    capacity: 10
    refill-tokens: 10
    refill-duration: 60s
