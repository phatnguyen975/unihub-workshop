# =============================================================================
# Spring Boot Application Configuration
# =============================================================================
spring:
  application:
    name: unihub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

app:
  http:
    retry-after-seconds: ${APP_HTTP_RETRY_AFTER_SECONDS:30}
  security:
    presign-ttl-minutes: 15
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 7
    public-paths:
      - "/actuator/**"
      - "/swagger-ui.html"
      - "/swagger-ui/**"
      - "/v3/api-docs/**"
      - "/.well-known/jwks.json"
      - "/api/v1/payments/webhook"
      - "/api/v1/auth/login"
      - "/api/v1/auth/refresh"
      - "/api/v1/auth/register"
      - "/api/v1/auth/activate"
      - "/api/v1/auth/otp/resend"
  otp:
    hmac-secret: ${APP_OTP_HMAC_SECRET:super-secret-hmac-key-for-otp-generation-and-verification-unihub}
    ttl-minutes: ${APP_OTP_TTL_MINUTES:15}
  cors:
    allowed-origin-patterns:
      - "http://localhost:[*]"
      - "https://app.unihub.com"
  realtime:
    heartbeat-interval-seconds: ${APP_REALTIME_HEARTBEAT_INTERVAL_SECONDS:15}
    stream-timeout-ms: ${APP_REALTIME_STREAM_TIMEOUT_MS:1800000}

# =============================================================================
# Datasource Configuration
# =============================================================================
datasource:
  primary:
    url: ${SPRING_DATASOURCE_PRIMARY_URL}
    username: ${SPRING_DATASOURCE_PRIMARY_USERNAME}
    password: ${SPRING_DATASOURCE_PRIMARY_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_PRIMARY_HIKARI_MAXIMUM_POOL_SIZE:10}
  replica:
    url: ${SPRING_DATASOURCE_REPLICA_URL}
    username: ${SPRING_DATASOURCE_REPLICA_USERNAME}
    password: ${SPRING_DATASOURCE_REPLICA_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_REPLICA_HIKARI_MAXIMUM_POOL_SIZE:10}

# =============================================================================
# Actuator — Expose only prometheus and health; disable everything else
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  # Common metric tags applied to every meter
  metrics:
    tags:
      application: ${spring.application.name}
      host: ${HOSTNAME:unknown}

# =============================================================================
# RSA Key Configuration
# =============================================================================
rsa:
  private-key: classpath:security/private.pem
  public-key: classpath:security/public.pem

# =============================================================================
# Seed Data Configuration — Organizations & Root Organizers
# =============================================================================
seed:
  organizations: ${SEED_ORGANIZATIONS:[]}
  root-organizers: ${SEED_ROOT_ORGANIZERS:[]}

# =============================================================================
# Rate Limit Configuration
# =============================================================================
rate-limit:
  registration-path-patterns:
    - "/api/v1/registrations/**"
  registration-tier:
    capacity: 5
    refill-tokens: 5
    refill-duration: 10s
  browsing-tier:
    capacity: 100
    refill-tokens: 100
    refill-duration: 60s

# =============================================================================
# Resilience4j Configuration
# =============================================================================
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_SLIDING_WINDOW_TYPE:COUNT_BASED}
        sliding-window-size: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_MINIMUM_NUMBER_OF_CALLS:5}
        failure-rate-threshold: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_FAILURE_RATE_THRESHOLD:50}
        slow-call-rate-threshold: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_SLOW_CALL_RATE_THRESHOLD:50}
        slow-call-duration-threshold: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_SLOW_CALL_DURATION_THRESHOLD:2s}
        wait-duration-in-open-state: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_WAIT_DURATION_IN_OPEN_STATE:10s}
        permitted-number-of-calls-in-half-open-state: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_PERMITTED_CALLS_IN_HALF_OPEN:3}
        register-health-indicator: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_REGISTER_HEALTH_INDICATOR:true}
        automatic-transition-from-open-to-half-open-enabled: ${RESILIENCE4J_CIRCUITBREAKER_DEFAULT_AUTO_HALF_OPEN:true}
