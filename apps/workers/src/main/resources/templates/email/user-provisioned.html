<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Account Provisioned</title>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            font-family:
                &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
            color: #333333;
        "
    >
        <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="background-color: #f4f6f8; padding: 30px 15px"
        >
            <tr>
                <td align="center">
                    <table
                        role="presentation"
                        border="0"
                        cellpadding="0"
                        cellspacing="0"
                        width="100%"
                        style="
                            max-width: 600px;
                            background-color: #ffffff;
                            border-radius: 8px;
                            overflow: hidden;
                            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
                        "
                    >
                        <!-- Reusable Header Fragment -->
                        <tr
                            th:replace="~{email/fragments/header :: email-header}"
                        ></tr>

                        <!-- Body Content -->
                        <tr>
                            <td style="padding: 30px 25px">
                                <h2
                                    style="
                                        margin: 0 0 15px;
                                        color: #1a1a1a;
                                        font-size: 20px;
                                        font-weight: 600;
                                    "
                                >
                                    Welcome to UniHub Workshop
                                </h2>
                                <p
                                    style="
                                        margin: 0 0 15px;
                                        font-size: 15px;
                                        line-height: 1.6;
                                        color: #4b5563;
                                    "
                                >
                                    Hello
                                    <strong
                                        th:text="${fullName != null ? fullName : 'User'}"
                                        >User</strong
                                    >,
                                </p>
                                <p
                                    style="
                                        margin: 0 0 15px;
                                        font-size: 15px;
                                        line-height: 1.6;
                                        color: #4b5563;
                                    "
                                >
                                    Your account has been successfully
                                    provisioned. Please use the temporary
                                    password below to sign in:
                                </p>

                                <div
                                    style="
                                        background-color: #f9fafb;
                                        border: 1px dashed #2563eb;
                                        border-radius: 6px;
                                        padding: 20px;
                                        margin: 25px 0;
                                        text-align: center;
                                    "
                                >
                                    <div
                                        style="
                                            font-size: 22px;
                                            font-weight: 700;
                                            letter-spacing: 2px;
                                            color: #1e40af;
                                            font-family:
                                                &quot;Courier New&quot;,
                                                Courier, monospace;
                                        "
                                        th:text="${temporaryPassword}"
                                    >
                                        TempPass123!
                                    </div>
                                </div>

                                <p
                                    style="
                                        margin: 15px 0 0;
                                        font-size: 14px;
                                        line-height: 1.6;
                                        color: #dc2626;
                                        font-weight: 500;
                                    "
                                >
                                    For security reasons, you will be required
                                    to change your password upon your first sign
                                    in.
                                </p>
                            </td>
                        </tr>

                        <!-- Reusable Footer Fragment -->
                        <tr
                            th:replace="~{email/fragments/footer :: email-footer}"
                        ></tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
