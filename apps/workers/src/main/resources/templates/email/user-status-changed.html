<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Account Status Update</title>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            font-family:
                &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
            color: #333333;
        "
    >
        <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="background-color: #f4f6f8; padding: 30px 15px"
        >
            <tr>
                <td align="center">
                    <table
                        role="presentation"
                        border="0"
                        cellpadding="0"
                        cellspacing="0"
                        width="100%"
                        style="
                            max-width: 600px;
                            background-color: #ffffff;
                            border-radius: 8px;
                            overflow: hidden;
                            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
                        "
                    >
                        <!-- Reusable Header Fragment -->
                        <tr
                            th:replace="~{email/fragments/header :: email-header}"
                        ></tr>

                        <!-- Body Content -->
                        <tr>
                            <td style="padding: 30px 25px">
                                <h2
                                    style="
                                        margin: 0 0 15px;
                                        color: #1a1a1a;
                                        font-size: 20px;
                                        font-weight: 600;
                                    "
                                >
                                    Account Status Update
                                </h2>
                                <p
                                    style="
                                        margin: 0 0 15px;
                                        font-size: 15px;
                                        line-height: 1.6;
                                        color: #4b5563;
                                    "
                                >
                                    Hello
                                    <strong
                                        th:text="${fullName != null ? fullName : 'User'}"
                                        >User</strong
                                    >,
                                </p>
                                <p
                                    style="
                                        margin: 0 0 15px;
                                        font-size: 15px;
                                        line-height: 1.6;
                                        color: #4b5563;
                                    "
                                >
                                    Your UniHub Workshop account status has been
                                    updated.
                                </p>

                                <div
                                    style="
                                        background-color: #f9fafb;
                                        border: 1px solid #e5e7eb;
                                        border-radius: 6px;
                                        padding: 20px;
                                        margin: 20px 0;
                                        text-align: center;
                                    "
                                >
                                    <span
                                        style="font-size: 14px; color: #6b7280"
                                        >Current Status:
                                    </span>
                                    <strong
                                        style="font-size: 16px; color: #111827"
                                        th:text="${status != null ? status : (isActive ? 'ACTIVE' : 'INACTIVE')}"
                                    >
                                        ACTIVE
                                    </strong>
                                </div>

                                <p
                                    style="
                                        margin: 20px 0 0;
                                        font-size: 14px;
                                        line-height: 1.6;
                                        color: #6b7280;
                                    "
                                >
                                    If you have questions regarding this change,
                                    please contact your university
                                    administrator.
                                </p>
                            </td>
                        </tr>

                        <!-- Reusable Footer Fragment -->
                        <tr
                            th:replace="~{email/fragments/footer :: email-footer}"
                        ></tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
