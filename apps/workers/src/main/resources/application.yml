# =============================================================================
# Spring Boot Application Configuration
# =============================================================================
spring:
  application:
    name: unihub-workers
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: false
  batch:
    job:
      enabled: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

app:
  batch-ingestion:
    cron: ${INGESTION_CRON:0 0 2 * * ?}
    expected-faculties: ${INGESTION_EXPECTED_FACULTIES:Information Technology,Mathematics,Physics,Chemistry}
    reject-dir: ${INGESTION_REJECT_DIR:resources}
    max-file-size: ${INGESTION_MAX_FILE_SIZE:104857600}
  ttl-cleanup:
    cron: ${TTL_CLEANUP_CRON:0 0 */6 * * *}
  storage:
    buckets:
      csv: unihub-csv-drops

# =============================================================================
# Datasource Configuration
# =============================================================================
datasource:
  primary:
    url: ${SPRING_DATASOURCE_PRIMARY_URL}
    username: ${SPRING_DATASOURCE_PRIMARY_USERNAME}
    password: ${SPRING_DATASOURCE_PRIMARY_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_PRIMARY_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout-ms: 30000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      pool-name: primary-pool
  replica:
    url: ${SPRING_DATASOURCE_REPLICA_URL}
    username: ${SPRING_DATASOURCE_REPLICA_USERNAME}
    password: ${SPRING_DATASOURCE_REPLICA_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_REPLICA_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout-ms: 30000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      pool-name: replica-pool

# =============================================================================
# Actuator — Expose only prometheus and health; disable everything else
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  # Common metric tags applied to every meter
  metrics:
    tags:
      application: ${spring.application.name}
      host: ${HOSTNAME:unknown}
