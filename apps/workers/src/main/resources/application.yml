# =============================================================================
# Spring Boot Application Configuration
# =============================================================================
spring:
  application:
    name: unihub-workers
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: false
  batch:
    job:
      enabled: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  notifications:
    queue: ${NOTIFICATIONS_QUEUE:q.notifications}
    exchange: ${NOTIFICATIONS_EXCHANGE:unihub.events}
    dlx: ${NOTIFICATIONS_DLX:unihub.dlx}
    dlq-routing-key: ${NOTIFICATIONS_DLQ_ROUTING_KEY:dlq}
    mail:
      from: ${NOTIFICATIONS_MAIL_FROM:noreply@unihub.edu.vn}
      from-name: ${NOTIFICATIONS_MAIL_FROM_NAME:UniHub Workshop}
  search-sync:
    index-name: ${SEARCH_SYNC_INDEX_NAME:workshops}
    queue: ${SEARCH_SYNC_QUEUE:q.search}
    exchange: ${SEARCH_SYNC_EXCHANGE:unihub.events}
  batch-ingestion:
    cron: ${INGESTION_CRON:0 0 2 * * ?}
    expected-faculties: ${INGESTION_EXPECTED_FACULTIES:Information Technology,Mathematics,Physics,Chemistry}
    reject-dir: ${INGESTION_REJECT_DIR:resources}
    max-file-size: ${INGESTION_MAX_FILE_SIZE:104857600}
    bucket: unihub-csv-drops
  ttl-cleanup:
    cron: ${TTL_CLEANUP_CRON:0 0 */6 * * *}
  ai:
    queue: ${AI_SUMMARIZATION_QUEUE:q.ai.summarization}
    exchange: ${AI_SUMMARIZATION_EXCHANGE:unihub.events}
    dlx: ${AI_SUMMARIZATION_DLX:unihub.dlx}
    dlq-routing-key: ${AI_SUMMARIZATION_DLQ_ROUTING_KEY:dlq}
    routing-key: ${AI_SUMMARIZATION_ROUTING_KEY:ai.summarization}
    provider: ${AI_PROVIDER:mock}
    max-attempts: ${AI_MAX_ATTEMPTS:3}
    bucket: unihub-brochures
    gemini:
      model: ${AI_GEMINI_MODEL:gemini-3.8-flash}
      api-key: ${AI_GEMINI_API_KEY:}
      endpoint: ${AI_GEMINI_ENDPOINT:https://generativelanguage.googleapis.com}
      timeout-seconds: 30

# =============================================================================
# Datasource Configuration
# =============================================================================
datasource:
  primary:
    url: ${SPRING_DATASOURCE_PRIMARY_URL}
    username: ${SPRING_DATASOURCE_PRIMARY_USERNAME}
    password: ${SPRING_DATASOURCE_PRIMARY_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_PRIMARY_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout-ms: 30000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      pool-name: primary-pool
  replica:
    url: ${SPRING_DATASOURCE_REPLICA_URL}
    username: ${SPRING_DATASOURCE_REPLICA_USERNAME}
    password: ${SPRING_DATASOURCE_REPLICA_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_REPLICA_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout-ms: 30000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      pool-name: replica-pool

# =============================================================================
# Actuator — Expose only prometheus and health; disable everything else
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  # Common metric tags applied to every meter
  metrics:
    tags:
      application: ${spring.application.name}
      host: ${HOSTNAME:unknown}

# =============================================================================
# Resilience4j Circuit Breaker Configuration
# =============================================================================
resilience4j:
  circuitbreaker:
    instances:
      emailProvider:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      aiProvider:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
