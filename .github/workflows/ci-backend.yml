name: CI — Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".gitleaks.toml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".gitleaks.toml"

# Cancel in-flight runs for the same PR to save runner minutes, but never cancel runs on main
concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/backend

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew test --no-daemon --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: apps/backend/build/reports/tests/test/
          retention-days: 7
